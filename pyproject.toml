[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sitebosshub-demo"
version = "0.2.0"
description = "SitebossHub demo backend: serves the original HTML UI and simulates SNMP-polled cell-tower sensor telemetry."
readme = "README.md"
license = "MIT"
authors = [{name = "Derek Poe"}]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "build>=1.2",
]
browser = ["playwright>=1.48,<2"]

[project.scripts]
sitebosshub-demo = "sbh_demo.__main__:main"

[tool.setuptools.package-data]
sbh_demo = ["assets/*.html", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

