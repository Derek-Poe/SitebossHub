name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m build
      - name: Install wheel and serve packaged assets outside checkout
        run: |
          python -m venv /tmp/sbh-wheel
          /tmp/sbh-wheel/bin/python -m pip install dist/*.whl httpx
          cd /tmp
          /tmp/sbh-wheel/bin/python -c "from fastapi.testclient import TestClient; from sbh_demo.app import create_app; c=TestClient(create_app()); assert all(c.get(p).status_code == 200 for p in ['/SitebossHub','/EP_SitebossHub','/SitebossHistory','/favicon.ico','/demo/all'])"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[browser]'
      - run: python -m playwright install --with-deps chromium
      - name: Start local simulator and exercise UI
        run: |
          python -m sbh_demo > /tmp/sbh-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9747/healthz; then break; fi
            sleep 1
          done
          python tools/browser_smoke.py
